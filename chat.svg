<svg width="580" height="280" viewBox="0 0 580 280" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bubble-border-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fe428e" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <style>
    .bubble {
      fill: #141321;
      stroke: url(#bubble-border-dark);
      stroke-width: 1.5;
    }
    a {
      fill: #00f2fe;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
      fill: #fe428e;
    }
    text {
      fill: #f8fafc;
      font-size: 15px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: -0.01em;
    }
    
    .accent-pink {
      fill: #fe428e;
      font-weight: 700;
    }
    .accent-cyan {
      fill: #00f2fe;
      font-weight: 700;
    }
    .accent-gold {
      fill: #f8d847;
      font-weight: 700;
    }

    .typing-1 {
      opacity: 0;
      animation: fade-in-out 1.5s;
    }

    .msg-1 {
      animation: wait 1.7s, msg-1 0.25s 1.7s;
    }

    .typing-2 {
      opacity: 0;
      animation: wait 2.3s, fade-in-out 1.5s 2.3s;
    }

    .msg-2 {
      animation: wait 4.0s, msg-2 0.25s 4.0s;
    }

    .typing-3 {
      opacity: 0;
      animation: wait 4.8s, fade-in-out 1.5s 4.8s;
    }

    .msg-3 {
      animation: wait 6.5s, msg-3 0.25s 6.5s;
    }

    .msg-4 {
      animation: wait 8.8s, msg-4 0.25s 8.8s;
    }

    .msg-5 {
      animation: wait 11.2s, msg-5 0.25s 11.2s;
    }
    
    @keyframes wait {
      0%, 100% {
        opacity: 0;
      }
    }

    @keyframes fade-in-out {
      0%, 100% {
        opacity: 0;
      }
      25%, 90% {
        opacity: 1;
      }
    }

    @keyframes msg-1 {
      0% {
        opacity: 0;
        transform: translate(10px, 6px);
      }
      100% {
        opacity: 1;
        transform: translate(10px, 0px);
      }
    }

    @keyframes msg-2 {
      0% {
        opacity: 0;
        transform: translate(10px, 54px);
      }
      100% {
        opacity: 1;
        transform: translate(10px, 48px);
      }
    }

    @keyframes msg-3 {
      0% {
        opacity: 0;
        transform: translate(10px, 126px);
      }
      100% {
        opacity: 1;
        transform: translate(10px, 120px);
      }
    }

    @keyframes msg-4 {
      0% {
        opacity: 0;
        transform: translate(10px, 174px);
      }
      100% {
        opacity: 1;
        transform: translate(10px, 168px);
      }
    }    

    @keyframes msg-5 {
      0% {
        opacity: 0;
        transform: translate(10px, 222px);
      }
      100% {
        opacity: 1;
        transform: translate(10px, 216px);
      }
    }    
    
    @media (prefers-color-scheme: light) {
      .bubble {
        fill: #ffffff;
        stroke: #e2e8f0;
        stroke-width: 1.5;
      }
      text {
        fill: #0f172a;
      }
      a {
        fill: #0284c7;
      }
      a:hover {
        fill: #fe428e;
      }
      .accent-pink {
        fill: #e11d48;
      }
      .accent-cyan {
        fill: #0284c7;
      }
      .accent-gold {
        fill: #d97706;
      }
    }
  </style>

  <!-- Message 1: Intro -->
  <g transform="translate(10, 0)" class="msg-1">
    <rect width="250" height="40" rx="16" class="bubble" />
    <text x="16" y="25">Hi, I'm <tspan class="accent-pink">Aniket Singh</tspan> 👋</text>
  </g>

  <!-- Typing 2 -->
  <g transform="translate(10, 48)" class="typing-2">
    <rect x="0" width="70" height="40" rx="16" class="bubble" />
    <circle cx="22" cy="20" r="4.5" fill="#fe428e">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="35" cy="20" r="4.5" fill="#f8d847">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="48" cy="20" r="4.5" fill="#00f2fe">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Message 2: Education & Focus -->
  <g transform="translate(10, 48)" class="msg-2">
    <rect width="490" height="64" rx="16" class="bubble" />
    <text x="16" y="26">🎓 B.Tech CSE Student &amp; <tspan class="accent-cyan">AI / ML Explorer</tspan> 🚀</text>
    <text x="16" y="49">💡 Passionate about <tspan class="accent-pink">Prompt Engineering</tspan> &amp; <tspan class="accent-gold">Vibe Coding</tspan></text>
  </g>

  <!-- Typing 3 -->
  <g transform="translate(10, 120)" class="typing-3">
    <rect x="0" width="70" height="40" rx="16" class="bubble" />
    <circle cx="22" cy="20" r="4.5" fill="#fe428e">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="35" cy="20" r="4.5" fill="#f8d847">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="48" cy="20" r="4.5" fill="#00f2fe">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" begin="0.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Message 3: Projects -->
  <g transform="translate(10, 120)" class="msg-3">
    <rect width="520" height="40" rx="16" class="bubble" />
    <text x="16" y="25">🤖 Building <tspan class="accent-pink">ResuSmart</tspan>, <tspan class="accent-gold">AAPDA-MITRA</tspan> &amp; <tspan class="accent-cyan">Voice Assistant</tspan></text>
  </g>

  <!-- Message 4: Contact -->
  <g transform="translate(10, 168)" class="msg-4">
    <rect width="560" height="40" rx="16" class="bubble" />
    <text x="16" y="25">📬 Reach out via aniketsingh4500@gmail.com or <a xlink:href="https://www.linkedin.com/in/aniketsingh45" target="_blank">LinkedIn</a></text>
  </g>

  <!-- Message 5: GitHub Repos -->
  <g transform="translate(10, 216)" class="msg-5">
    <rect width="530" height="40" rx="16" class="bubble" />
    <text x="16" y="25">⭐ Explore all my code &amp; repos at <a xlink:href="https://github.com/Aniketsingh-45" target="_blank">github.com/Aniketsingh-45</a></text>
  </g>
</svg>
